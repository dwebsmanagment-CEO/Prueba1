<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Piloto V2</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: #333; 
            background-color: #f4f4f5;
        }
        header { 
            background: #18181b; 
            color: white; 
            padding: 2rem; 
            text-align: center; 
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;

        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Web Piloto</h1>
    </header>

    <div class="container">
        <h2>Bienvenido a la nueva versión</h2>
        <p>Esta es la página pública. Más adelante, los textos y esta imagen se cambiarán desde tu panel de administración.</p>
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=800&q=80" alt="Espacio de trabajo limpio">
    </div>

</body>
</html>
