<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración</title>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <!-- Añadimos un parámetro de versión aquí para forzar a Safari a descargar el motor de nuevo -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js?v=madrugada4"></script>

    <script>
      CMS.init({
        config: {
          load_config_file: false, /* ✅ ¡Aquí está la pieza que faltaba, dentro de config! */
          backend: {
            name: 'github',
            repo: 'dwebsmanagment-CEO/Prueba1',
            branch: 'main',
            client_id: 'Ov23liUVAgXcSMySYZby'
          },
          media_folder: 'images',
          public_folder: '/images',
          collections: [
            {
              name: 'configuracion',
              label: 'Ajustes de Prueba',
              files: [
                {
                  file: 'datos.json',
                  name: 'general',
                  label: 'Textos de la web',
                  fields: [
                    { label: 'Título de prueba', name: 'titulo', widget: 'string' }
                  ]
                }
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
