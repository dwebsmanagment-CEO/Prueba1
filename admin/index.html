<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración</title>
    <script>
      window.CMS_MANUAL_INIT = true;
      
      // El "chivato" para imprimir errores en la pantalla del iPad
      window.onerror = function (msg, src, line, col, err) {
        document.body.innerHTML =
          '<pre style="white-space:pre-wrap;padding:20px;font-family:monospace;color:red;font-size:16px;">' +
          'ERROR: ' + msg + '\n' +
          'Línea: ' + line + ':' + col + '\n' +
          (err && err.stack ? err.stack : '') +
          '</pre>';
      };
    </script>
  </head>
  <body>
    <!-- Dejamos la URL base temporalmente para que el chivato cace el error de la última versión -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js?v=debug"></script>

    <script>
      CMS.init({
        config: {
          load_config_file: false, 
          backend: {
            name: 'github',
            repo: 'dwebsmanagment-CEO/Prueba1',
            branch: 'main',
            client_id: 'Ov23lifTQxJRG4Z8y78V'
          },
          media_folder: 'images',
          public_folder: '/images',
          collections: [
            {
              name: 'configuracion',
              label: 'Ajustes de Prueba',
              files: [
                {
                  file: 'datos.json',
                  name: 'general',
                  label: 'Textos de la web',
                  fields: [
                    { label: 'Título de prueba', name: 'titulo', widget: 'string' }
                  ]
                }
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
