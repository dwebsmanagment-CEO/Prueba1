<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración</title>
    <!-- Desactivamos la carga de archivos externos para evitar cachés -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <!-- Cargamos el CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Inyectamos tu configuración exacta sin base_url -->
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'dwebsmanagment-CEO/Prueba1',
            branch: 'main',
            auth_type: 'pkce',
            app_id: 'Ov23liUVAgXcSMySYZby'
          },
          media_folder: 'images',
          public_folder: '/images',
          collections: [
            {
              name: 'configuracion',
              label: 'Ajustes de Prueba',
              files: [
                {
                  file: 'datos.json',
                  name: 'general',
                  label: 'Textos de la web',
                  fields: [
                    { label: 'Título de prueba', name: 'titulo', widget: 'string' }
                  ]
                }
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
